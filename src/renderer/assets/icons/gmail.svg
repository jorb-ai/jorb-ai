<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Cute house-style mark, not the official Gmail "M": plump rounded
       envelope in the provider's warm-red family + a little unread-dot
       charm. Sibling of outlook.svg (same geometry, different colorway) -
       keep the pair in lockstep. Reads at 14px (sidebar row) and 24px
       (provider tile). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A80"/>
      <stop offset="1" stop-color="#E94235"/>
    </linearGradient>
  </defs>
  <rect x="4" y="11" width="40" height="30" rx="10" fill="url(#body)"/>
  <path d="M11 18.5 L24 28 L37 18.5" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="39" cy="13" r="5" fill="#FFD54F" stroke="#FFFFFF" stroke-width="2.4"/>
</svg>
